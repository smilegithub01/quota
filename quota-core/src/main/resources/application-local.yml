# 本地运行 profile：无 MySQL/Redis/RabbitMQ/ES 中间件时使用 H2 内存库启动
# 启动方式: java -jar quota-core-1.0.0-SNAPSHOT.jar --spring.profiles.active=local
spring:
  # 明确使用 servlet web 类型，避免 classpath 中 Spring Cloud Gateway 触发 reactive 冲突
  main:
    web-application-type: servlet

  datasource:
    url: jdbc:h2:mem:quotadb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      pool-name: QuotaHikariCP-Local

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # 禁用 Spring Cloud Alibaba 中间件
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
    sentinel:
      enabled: false
    seata:
      enabled: false
    # 本项目为 MVC 应用，classpath 含 Spring Cloud Gateway 依赖会触发冲突，禁用网关
    gateway:
      enabled: false

  # 排除本地不可用中间件的自动配置
  # RedissonAutoConfigurationV2 创建 bean 时会主动连 Redis，故排除改用 LocalRedissonConfig（懒连接）
  # 本项目为 MVC 应用，classpath 含 Spring Cloud Gateway 依赖会与 MVC 冲突，全部排除 Gateway 自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.cloud.gateway.config.GatewayClassPathWarningAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayResilience4JCircuitBreakerAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayNoLoadBalancerClientAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayMetricsAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayRedisAutoConfiguration
      - org.springframework.cloud.gateway.discovery.GatewayDiscoveryClientAutoConfiguration
      - org.springframework.cloud.gateway.config.SimpleUrlHandlerMappingGlobalCorsAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayReactiveLoadBalancerClientAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayReactiveOAuth2AutoConfiguration
      - org.springframework.cloud.gateway.config.LocalResponseCacheAutoConfiguration
      # JDK 17.0.2 在 cgroup v2 容器中 ProcessorMetrics 读取 cgroup 失败，排除系统指标自动配置
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration
      # 本地无 Redis 连接工厂，RedisKeyValueAdapter 需要 ConnectionFactory，排除 Redis Repositories
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging:
  level:
    root: INFO
    com.bank.quota: INFO
