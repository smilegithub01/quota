name: Build and Run

on:
  push:
    branches: [ "main", "trae/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 支持手动触发

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '.mvn/settings.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn -B -ntp clean package -Dmaven.test.skip=true -s .mvn/settings.xml -pl quota-common,quota-core -am

      - name: Verify artifact
        run: |
          ls -lh quota-core/target/quota-core-1.0.0-SNAPSHOT.jar

      - name: Start application (local profile)
        run: |
          java -jar quota-core/target/quota-core-1.0.0-SNAPSHOT.jar \
            --spring.profiles.active=local \
            > app.log 2>&1 &
          echo $! > app.pid
          echo "App PID: $(cat app.pid)"

      - name: Wait for startup
        run: |
          # 轮询等待应用启动，最多 90 秒
          for i in $(seq 1 90); do
            if grep -q "Started QuotaSystemApplication" app.log 2>/dev/null; then
              echo "Application started successfully after ${i}s"
              exit 0
            fi
            if grep -q "APPLICATION FAILED TO START" app.log 2>/dev/null; then
              echo "Application failed to start"
              exit 1
            fi
            sleep 1
          done
          echo "Application did not start within 90 seconds"
          exit 1

      - name: Health check
        run: |
          # 验证应用可响应（根路径 200 即认为可用）
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/quota-system/ || echo "000")
          echo "HTTP status: $code"
          if [ "$code" = "200" ]; then
            echo "Health check passed"
          else
            echo "Health check returned non-200, but startup succeeded (may be expected for some endpoints)"
          fi

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs
          path: app.log
          retention-days: 7
